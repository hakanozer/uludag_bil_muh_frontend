@if (itemData) {
<div class="card">
    <img src="{{ itemData.images[0] }}" class="card-img-top" alt="{{ itemData.title }}">
    <div class="card-body">
        <h5 class="card-title">{{ itemData.title | titlePipe }}</h5>
        <p class="card-text">{{ itemData.price }} ₺</p>
        <a [routerLink]="['/all-products-detail', itemData.id]" class="btn btn-primary">Detail</a>
    </div>
</div>
}
